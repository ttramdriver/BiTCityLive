<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BiTCityLive - Komunikacja miejska na żywo</title>
    
    <style>
        :root {
            --bg-color: #f9f9f9;
            --surface-color: #ffffff;
            --primary-color: #2e7d32;
            --text-main: #1a1a1a;
            --text-secondary: #555555;
            --border-color: #dddddd;
            --hover-bg: #f1f1f1;
            --alert-color: #ffb300bb;
            --alert-border-color: #ffb300;
            --calendar-invert: 0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --surface-color: #1e1e1e;
                --primary-color: #4CAF50;
                --text-main: #ffffff;
                --text-secondary: #a0a0a0;
                --border-color: #333333;
                --hover-bg: #2a2d2e;
                --alert-color: #f3a300dd;
                --alert-border-color: #f3a300;
                --calendar-invert: 1;
            }
        }

        html {
            background-color: var(--bg-color);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .brand-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .brand-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .top-nav {
            width: 100%;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-icons { display: flex; gap: 15px; }
        .nav-icons a { color: var(--text-secondary); transition: color 0.2s; }
        .nav-icons a:hover { color: var(--primary-color); }
        .nav-title { font-size: 1.5em; letter-spacing: 1px; }
        .hamburger-btn { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 5px; }
        
        .side-menu {
            position: fixed; 
            top: 0; 
            right: 0; 
            bottom: 0;
            width: 250px;
            background-color: var(--surface-color); 
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            transform: translateX(100%);
            z-index: 1000; 
            padding: 60px 20px 20px;
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            box-sizing: border-box;
        }
        
        .side-menu.open { 
            transform: translateX(0);
        }
        .close-menu-btn { position: absolute; top: 15px; right: 20px; font-size: 35px; background: none; border: none; color: var(--text-main); cursor: pointer; }
        .menu-link { text-decoration: none; color: var(--text-main); font-size: 1.2em; padding: 10px; border-radius: 8px; border: 1px solid transparent; transition: all 0.2s; }
        .menu-link:hover { background-color: var(--hover-bg); border-color: var(--border-color); color: var(--primary-color); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 2000; display: none;
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
            padding: 20px; box-sizing: border-box;
        }

        .modal-content {
            background: var(--surface-color); border-radius: 12px; 
            width: 100%; max-width: 600px;
            margin: 40px auto; 
            padding: 30px; position: relative; box-sizing: border-box;
        }
        .modal-buttons { display: flex; gap: 15px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .modal-buttons button { padding: 12px 20px; border-radius: 8px; background: transparent; border: 2px solid var(--primary-color); color: var(--text-main); font-weight: bold; cursor: pointer; font-size: 1em; transition: 0.2s; }
        .modal-buttons button:hover { background: var(--primary-color); color: #fff; }

        .main-content {
            max-width: 1200px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-container { text-align: center; margin-bottom: 40px; margin-top: 10px; width: 100%; }
        .header-title { font-size: 3em; margin: 0; letter-spacing: 1px; }
        .header-subtitle { color: var(--text-secondary); font-size: 1.1em; margin-top: 5px; }

    </style>
</head>
<body>
    <div class="main-content">
        <p>[strona w budowie]</p>
        <p>W międzyczasie więcej informacji o zmianach tras znajdziesz na stronach internetowych przewoźników, tj.<br>
        <a href="https://zdmikp.bydgoszcz.pl" target="_blank">https://zdmikp.bydgoszcz.pl</a>, <a href="https://mzk-torun.pl" target="_blank">https://mzk-torun.pl</a>, oraz na stronie odpowiednich przewoźników kolejowych.</p>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('side-menu');
            menu.classList.toggle('open');
        }

        function getPreferredColorScheme() {
            let systemScheme = 'light';
            if(window.matchMedia('(prefers-color-scheme: dark)').matches){
                systemScheme = 'dark';
            }
            let chosenScheme = systemScheme;

            if(localStorage.getItem("scheme")){
                chosenScheme = localStorage.getItem("scheme");
            }

            if(systemScheme === chosenScheme){
                localStorage.removeItem("scheme");
            }

            return chosenScheme;
        }

        function savePreferredColorScheme(scheme){
            let systemScheme = 'light';

            if(window.matchMedia('(prefers-color-scheme: dark)').matches){
                systemScheme = 'dark';
            }

            if(systemScheme === scheme){
                localStorage.removeItem("scheme");
            }
            else {
                localStorage.setItem("scheme", scheme);
            }

        }

        function toggleColorScheme(){
            let newScheme = "light";
            let scheme = getPreferredColorScheme();
            if (scheme === "light"){
                newScheme = "dark";
            }

            applyPreferredColorScheme(newScheme);
            savePreferredColorScheme(newScheme);
        }

        function applyPreferredColorScheme(scheme) {
            for (var s = 0; s < document.styleSheets.length; s++) {

                for (var i = 0; i < document.styleSheets[s].cssRules.length; i++) {
                    rule = document.styleSheets[s].cssRules[i];


                    if (rule && rule.media && rule.media.mediaText.includes("prefers-color-scheme")) {

                        switch (scheme) {
                            case "light":
                                rule.media.appendMedium("original-prefers-color-scheme");
                                if (rule.media.mediaText.includes("light")) rule.media.deleteMedium("(prefers-color-scheme: light)");
                                if (rule.media.mediaText.includes("dark")) rule.media.deleteMedium("(prefers-color-scheme: dark)");
                                break;
                            case "dark":
                                rule.media.appendMedium("(prefers-color-scheme: light)");
                                rule.media.appendMedium("(prefers-color-scheme: dark)");
                                if (rule.media.mediaText.includes("original")) rule.media.deleteMedium("original-prefers-color-scheme");
                                break;
                            default:
                                rule.media.appendMedium("(prefers-color-scheme: dark)");
                                if (rule.media.mediaText.includes("light")) rule.media.deleteMedium("(prefers-color-scheme: light)");
                                if (rule.media.mediaText.includes("original")) rule.media.deleteMedium("original-prefers-color-scheme");
                                break;
                        }
                    }
                }
            }
        }

        applyPreferredColorScheme(getPreferredColorScheme());
    </script>
</body>
</html>
